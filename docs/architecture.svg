<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1440" viewBox="0 0 840 1440" role="img" aria-labelledby="title desc">
<title id="title">Market Research System — architecture</title>
<desc id="desc">Three layers, scheduled production on the left, after-close research workstation on the right, and a data sources to outputs flow alongside.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#008A8A"/></marker></defs>
<rect width="840" height="1440" fill="#FFFFFF"/>
<style>text{font-family:Arial,sans-serif;fill:#16324F;font-size:24px}.title{font-size:33px;font-weight:700}.head{font-size:26px;font-weight:700}.small{font-size:20px;fill:#64748B}.box{fill:#F0F5F7;stroke:#CCD8DF;stroke-width:1.5}.flow{fill:none;stroke:#008A8A;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="35" y="60" class="title">Market Research System</text>
<text x="35" y="96" class="small">17 scheduled workflows · four research projects</text>
